version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Etc/UTC
    # Pause routine version updates while Switchyard is on ice. Security updates
    # remain eligible under GitHub's separate Dependabot security-update path.
    open-pull-requests-limit: 0
    versioning-strategy: increase
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:15"
      timezone: Etc/UTC
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
