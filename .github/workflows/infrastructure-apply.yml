name: Owner infrastructure apply, step 2 of 2

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Exact immutable GitHub plan artifact ID
        required: true
        type: string
      commit_sha:
        description: Exact lowercase commit SHA currently at main
        required: true
        type: string
      destructive_acknowledgement:
        description: Exact digest-bound acknowledgement when destructive; otherwise leave blank
        required: false
        default: ""
        type: string
      plan_digest:
        description: Full lowercase SHA-256 digest of the opaque saved plan
        required: true
        type: string
      plan_run_id:
        description: Exact first-attempt plan workflow run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  approve-plan:
    name: Approve the immutable infrastructure apply engine
    uses: example-org/switchyard/.github/workflows/infrastructure-apply-engine.yml@5c9b286fcb5761a3fcf4b4c87882ec56103333e7
    with:
      artifact_id: ${{ inputs.artifact_id }}
      commit_sha: ${{ inputs.commit_sha }}
      destructive_acknowledgement: ${{ inputs.destructive_acknowledgement }}
      plan_digest: ${{ inputs.plan_digest }}
      plan_run_id: ${{ inputs.plan_run_id }}
